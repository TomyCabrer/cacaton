<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copi Drill · Tower</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400..800&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/drill/classic/drill.css">
</head>
<body class="drill tower">
  <header class="bar">
    <div class="bar-id">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <div class="bar-title">Control tower</div>
        <div class="bar-case" id="case-name">No case loaded</div>
      </div>
    </div>
    <div class="bar-clock" id="clock">--:--:--</div>
    <div class="bar-right">
      <span class="presence" id="presence-pilot"><span class="dot" id="dot-driver"></span>Pilot</span>
      <span class="dot hidden" id="dot-control"></span>
      <button id="btn-start" class="go" disabled>Start</button>
      <button id="btn-end" class="quiet" disabled>End</button>
      <button id="btn-cases" class="quiet">Cases</button>
      <select id="speed" title="Drill speed" class="quiet">
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
    </div>
  </header>

  <div class="joinbar hidden" id="joinbar"></div>

  <section class="line-wrap">
    <svg id="line" viewBox="0 0 1400 178" preserveAspectRatio="xMidYMid meet" aria-label="Line diagram: tracks, signals and trains"></svg>
    <div class="line-hint">Click a signal to hold it at stop or release it</div>
  </section>

  <main class="tower-main">
    <!-- The human: decides and gives the orders -->
    <section class="col you">
      <div class="col-head">
        <span class="who-tag tower">You · Tower</span>
        <span class="col-sub">you decide and give the orders</span>
        <span class="col-meta" id="proto-progress"></span>
      </div>
      <div id="incoming"></div>
      <div id="release"></div>
      <div id="proto-head"></div>
      <div class="scroll" id="proto"></div>

      <div class="ptt-bar">
        <button class="ptt tower" id="btn-radio">
          <span class="ptt-ring"><i></i></span>
          <span class="ptt-text"><b>Hold <kbd>T</kbd> to talk to the pilot</b><small id="radio-state">radio</small></span>
        </button>
        <div class="peer" id="peer-pilot"><span class="lvl"><i></i></span><span>Pilot</span></div>
      </div>

      <details class="log">
        <summary>Radio log and manual controls</summary>
        <div class="scroll" id="radio"></div>
        <div class="sayrow">
          <input id="say" placeholder="Type to the pilot (if the radio is down)" autocomplete="off">
          <button id="btn-say">Send</button>
        </div>
        <div class="manual" id="manual"></div>
      </details>
    </section>

    <!-- The assistant: listens to everything, advises the tower, never acts -->
    <section class="col copi">
      <div class="col-head">
        <span class="who-tag copi">Copi · Assistant</span>
        <span class="col-sub">advises you, never acts</span>
        <span class="col-meta" id="copi-chip"></span>
      </div>

      <div class="copi-face">
        <button class="orb" id="orb" title="Hold C to ask Copi">
          <video id="copi-video" autoplay playsinline muted hidden></video>
          <span class="orb-core"></span>
        </button>
        <div class="copi-status">
          <div class="cs-state" id="copi-state">Copi is off</div>
          <div class="cs-hint" id="copi-hint">Press <kbd>C</kbd> or the circle to turn Copi's voice on</div>
        </div>
      </div>

      <div id="copi-now"></div>
      <div class="scroll copi-scroll">
        <div id="tracking"></div>
        <div id="copi-body"></div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.23.0/dist/livekit-client.umd.js"></script>
  <script src="/static/drill/classic/common.js"></script>
  <script src="/static/drill/classic/comms.js"></script>
  <script src="/static/drill/classic/control.js"></script>
</body>
</html>
